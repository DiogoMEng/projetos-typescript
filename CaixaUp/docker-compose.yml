services:
  dev:
    build: ./api
    container_name: caixaup_dev
    command: npm run dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      DB_USER: ${DB_USERNAME}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./api/:/app:cached
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s 

  web:
    build: ./web
    container_name: caixaup_web
    command: npm run dev -- --host 0.0.0.0
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./web/:/app:cached
      - /app/node_modules
    depends_on:
      dev:
        condition: service_healthy

  test:
    build: ./api
    container_name: caixaup_api_test
    command: npm run test:watch
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - ./api/:/app:cached

  db:
    image: ${DB_DIALECT}
    container_name: caixaup_db
    environment:
      - POSTGRES_USER=${DB_USERNAME}      
      - POSTGRES_PASSWORD=${DB_PASSWORD}  
      - POSTGRES_DB=${DB_NAME} 
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql

volumes:
  database: